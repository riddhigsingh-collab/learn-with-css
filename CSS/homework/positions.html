<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin:0;
        }
        .body{
            position:relative;
        }
        .body img{
            width:100vw;
            height:100vw;
            object-fit:cover;
            position:fixed;
        }
        .top-left{
            position: absolute;
            top: 8px;
            left: 16px;
            font-size: 20px;
        }
        .top-right{
            position: absolute;
            top: 10px;
            right: 10px;
        }
        .top-center{
            position: absolute;
            top: 10px;
            left: 50%;
        }
        .center-left{
            position: absolute;
            top: 50%;
            left: 10px;
        }
        .center-right{
            position: absolute;
            top: 50%;
            right: 10px;
        }
        .center{
            position:absolute;
            top: 50%;
            left: 50%;
        }
        .bottom-left{
            position:absolute;
            bottom: 10px;
            left: 10px;
        }
        .bottom-right{
            position:absolute;
            bottom: 10px;
            right: 10px;
        }
        .bottom-center{
            position:absolute;
            bottom: 10px;
            left: 50%;
        }
        .name {
            position: fixed;
            color: white;
            font-size: 30px;
            font-weight: bold;
        }
        

    </style>
</head>
<body>
    <div class="body">
        <img src="me3.jpeg" alt="">
        <div class="name top-left">RIDDHI</div>
        <div class="name top-center">RIDDHI</div>
        <div class="name top-right">RIDDHI</div>
        <div class="name center-left">RIDDHI</div>
        <div class="name center">RIDDHI</div>
        <div class="name center-right">RIDDHI</div>
        <div class="name bottom-left">RIDDHI</div>
        <div class="name bottom-center">RIDDHI</div>
        <div class="name bottom-right">RIDDHI</div>
    </div>
    
</body>
</html>
